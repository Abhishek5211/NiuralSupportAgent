[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "niural-support-agent"
version = "0.1.0"
description = "Customer support agent over synthetic Niural account data"
requires-python = ">=3.11"
dependencies = ["openai-agents==0.24.0", "python-dotenv>=1.2,<2", "pydantic>=2.12.2,<3", "ipykernel>=7,<8", "langsmith[openai-agents]==0.14.4", "langchain-text-splitters==1.1.3", "chromadb==1.5.9", "rank-bm25==0.2.2"]

[project.scripts]
niural-agent = "niural_support_agent.cli:main"
niural-benchmark = "niural_support_agent.run_benchmark:main"

[tool.setuptools.packages.find]
include = ["niural_support_agent*", "mock_api*"]

[tool.setuptools.package-data]
niural_support_agent = ["prompt.txt"]
mock_api = ["data/*.json", "*.md"]
